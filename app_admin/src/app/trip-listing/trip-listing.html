<!-- Add Trip button (hidden when not logged in) -->
<div class="row mb-3">
  <div class="col">
    <button class="btn btn-primary" *ngIf="auth?.isLoggedIn()" (click)="addTrip()">
      Add Trip
    </button>
  </div>
</div>

<!-- Trip cards: only render when trips is defined and non-empty -->
<div class="row" *ngIf="trips?.length">
  <div class="col-md-4 col-sm-12" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip"></app-trip-card>
  </div>
</div>

<!-- Status message -->
<p>{{ message }}</p>
