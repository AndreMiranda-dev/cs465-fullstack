<!-- Edit Trip form container -->
<div class="container mt-4">
  <h3>Edit Trip</h3>

  <!-- Edit Trip form -->
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <!-- Trip Code -->
    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input type="text" class="form-control" formControlName="code" readonly>
    </div>

    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" formControlName="name">
    </div>

    <!-- Length -->
    <div class="mb-3">
      <label class="form-label">Length</label>
      <input type="text" class="form-control" formControlName="length">
    </div>

    <!-- Start Date -->
    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="date" class="form-control" formControlName="start">
    </div>

    <!-- Resort -->
    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" class="form-control" formControlName="resort">
    </div>

    <!-- Price Per Person -->
    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="number" class="form-control" formControlName="perPerson">
    </div>

    <!-- Image Filename -->
    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input type="text" class="form-control" formControlName="image">
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="4" formControlName="description"></textarea>
    </div>

    <!-- Action buttons -->
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="router.navigate([''])">
      Cancel
    </button>

  </form>
</div>
